spring:
  datasource:
    url: jdbc:mysql://localhost:3306/connect_local_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: connect-local-test-secret-change-me-32-chars-minimum
    access-token-minutes: 60
    refresh-token-days: 7
  cors:
    allowed-origins: "*"
